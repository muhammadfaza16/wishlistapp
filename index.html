<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WISHLIST | Aspirations Catalog</title>
  <meta name="description" content="A curated personal aspiration and wishlist tracker. Minimalist design, precise savings tracking.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2318181b%22/><text x=%2250%25%22 y=%2262%25%22 font-family=%22monospace%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>W</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=218">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="header-top">
        <div class="header-top-left">
          <div class="brand">
            <svg class="seamless-logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" title="Wishlist">
              <path d="M6 11L12 26L18 15L24 26L30 11" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="18" cy="8" r="1.75" fill="currentColor"/>
            </svg>
          </div>
        </div>
        <!-- Header Right Group: User Profile -->
        <div class="header-right-group">
          <!-- User Profile / Auth Button -->
          <div class="user-profile-wrapper" id="user-profile-wrapper">
            <button type="button" class="user-profile-btn" id="user-profile-btn" aria-label="User Account" title="Account Menu">
              <div class="user-avatar-badge" id="user-avatar-badge">
                <i data-lucide="user" class="avatar-icon"></i>
              </div>
              <span class="user-display-name" id="user-display-name">Sign In</span>
              <i data-lucide="chevron-down" class="user-dropdown-arrow"></i>
            </button>

            <div class="user-profile-dropdown hidden" id="user-profile-dropdown">
              <div class="user-dropdown-header">
                <div class="user-dropdown-avatar" id="dropdown-user-avatar">
                  <i data-lucide="user"></i>
                </div>
                <div class="user-dropdown-info">
                  <div class="user-dropdown-name" id="dropdown-user-name">Guest User</div>
                  <div class="user-dropdown-email" id="dropdown-user-email">Not signed in</div>
                </div>
              </div>
              <div class="user-dropdown-stats">
                <div class="user-stat-item">
                  <span class="user-stat-count" id="dropdown-notes-count">0</span>
                  <span class="user-stat-label">Items</span>
                </div>
              </div>
              <div class="user-dropdown-divider"></div>
              <div class="user-dropdown-actions">
                <input type="file" id="import-json-input" accept=".json,application/json" style="display: none;">
                <button type="button" class="dropdown-action-btn" id="dropdown-sync-btn">
                  <i data-lucide="refresh-cw"></i>
                  <span>Sync Cloud Now</span>
                </button>
                <button type="button" class="dropdown-action-btn" id="dropdown-export-btn">
                  <i data-lucide="download"></i>
                  <span>Export Backup (.json)</span>
                </button>
                <button type="button" class="dropdown-action-btn" id="dropdown-import-btn">
                  <i data-lucide="upload"></i>
                  <span>Import Backup (.json)</span>
                </button>
                <div class="user-dropdown-divider"></div>
                <button type="button" class="dropdown-action-btn" id="dropdown-switch-user-btn">
                  <i data-lucide="user-check"></i>
                  <span>Switch Account</span>
                </button>
                <button type="button" class="dropdown-action-btn logout-action" id="dropdown-logout-btn">
                  <i data-lucide="log-out"></i>
                  <span>Log Out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Item List View (Quick Notes) -->
    <div id="notes-view">
      <div class="notes-summary-bar">
        <div class="stat-card">
          <span class="stat-label">TOTAL ESTIMATED</span>
          <span class="stat-value" id="notes-total-value">Rp 0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">CHECKED / ACQUIRED</span>
          <span class="stat-value" id="notes-checked-value">Rp 0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">REMAINING NEEDED</span>
          <span class="stat-value" id="notes-remaining-value">Rp 0</span>
        </div>
      </div>

      <div class="overall-progress notes-progress-container">
        <div class="progress-bar-container">
          <div class="progress-bar">
            <div class="progress-fill" id="notes-progress-fill"></div>
          </div>
        </div>
        <span class="progress-text mono-text" id="notes-progress-text">0%</span>
      </div>

      <div class="clean-notes-card">
        <div class="notes-card-header">
          <div class="notes-header-left">
            <span class="notes-card-title" id="notes-view-title">Wishlist Notes</span>
            <button type="button" id="notes-back-to-view-btn" class="btn-clean-action hidden" title="Back to view">
              <i data-lucide="arrow-left"></i>
              <span>Back</span>
            </button>
          </div>
          <div class="notes-header-controls">
            <!-- Sort Dropdown for Quick Notes -->
            <div class="notes-sort-dropdown" id="notes-sort-dropdown">
              <button type="button" class="btn-clean-action notes-sort-trigger" id="notes-sort-trigger" title="Sort items">
                <i data-lucide="arrow-up-down"></i>
                <span id="notes-sort-label">Sort</span>
                <i data-lucide="chevron-down" class="sort-chevron"></i>
              </button>
              <div class="sort-dropdown-menu hidden" id="notes-sort-menu">
                <button type="button" class="sort-menu-item" data-sort-category="title" data-sort="title">
                  <span>Title</span>
                  <i data-lucide="check" class="sort-check"></i>
                </button>
                <button type="button" class="sort-menu-item" data-sort-category="price" data-sort="price">
                  <span>Price</span>
                  <i data-lucide="check" class="sort-check"></i>
                </button>
                <button type="button" class="sort-menu-item" data-sort-category="date" data-sort="date">
                  <span>Date</span>
                  <i data-lucide="check" class="sort-check"></i>
                </button>
                <button type="button" class="sort-menu-item" data-sort-category="priority" data-sort="priority">
                  <span>Priority</span>
                  <i data-lucide="check" class="sort-check"></i>
                </button>
              </div>
            </div>

            <div class="notes-header-actions" id="notes-view-actions">
              <button type="button" id="notes-edit-mode-btn" class="btn-clean-action" title="Edit items">
                <i data-lucide="edit-3"></i>
                <span>Edit</span>
              </button>
            </div>

            <div class="notes-header-actions hidden" id="notes-edit-actions">
              <button type="button" id="notes-select-toggle-btn" class="btn-clean-action" title="Select multiple items">
                <i data-lucide="check-square"></i>
                <span>Select</span>
              </button>
              <button type="button" id="main-add-note-btn" class="btn-clean-action-primary" title="Add Note Item">
                <i data-lucide="plus"></i>
                <span>Add</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Multi-select Action Bar (Icon-only actions) -->
        <div id="notes-selection-bar" class="notes-selection-bar hidden">
          <span id="notes-selected-count" class="notes-selected-count">0 selected</span>
          <div class="notes-selection-actions">
            <button type="button" id="notes-select-all-btn" class="btn-selection-action" title="Select All / Deselect All" aria-label="Select All">
              <i data-lucide="check-check"></i>
            </button>
            <button type="button" id="notes-group-selected-btn" class="btn-selection-action btn-group-action" disabled title="Group selected items" aria-label="Group selected">
              <i data-lucide="folder-plus"></i>
            </button>
            <button type="button" id="notes-ungroup-selected-btn" class="btn-selection-action" disabled title="Remove selected from groups" aria-label="Ungroup selected">
              <i data-lucide="corner-up-left"></i>
            </button>
            <button type="button" id="notes-delete-selected-btn" class="btn-selection-action btn-delete-action" disabled title="Delete selected items" aria-label="Delete selected">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
        </div>

        <div id="quick-notes-manage-list" class="quick-notes-manage-list"></div>
      </div>
    </div>
  </div>

  <!-- Floating Mobile Action Bar -->
  <div id="mobile-floating-bar" class="mobile-only">
    <button id="mobile-add-btn" class="floating-primary-btn" title="Add Item">
      <i data-lucide="plus"></i>
    </button>
  </div>

  <!-- Group / Rename Modal -->
  <div id="group-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-sheet-handle mobile-only"></div>
      <div class="modal-header">
        <h2 id="group-modal-title">Group Items</h2>
        <button type="button" class="modal-close group-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="group-form">
          <div class="form-group" style="margin-bottom: 12px;">
            <label for="group-name-input">Group Name</label>
            <input type="text" id="group-name-input" placeholder="e.g. Outfit, Electronics, Desk Setup" required autocomplete="off" list="group-options-list">
            <datalist id="group-options-list"></datalist>
          </div>

          <div class="form-group" style="margin-bottom: 18px;">
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 8px; display: block;">Suggested Categories</label>
            <div class="category-preset-chips" id="group-modal-presets"></div>
          </div>

          <div class="form-actions">
            <button type="submit" id="group-save-btn" class="btn-primary" style="width: 100%;">Save Group</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog Modal -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-sheet-handle mobile-only"></div>
      <div class="modal-header">
        <h2 id="confirm-modal-title">Confirm Action</h2>
        <button type="button" class="modal-close confirm-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <p id="confirm-modal-message" style="margin-bottom: 20px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.5;"></p>
        <div class="form-actions">
          <button type="button" id="confirm-modal-action-btn" class="btn-danger">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Note Preview Modal (View Mode) -->
  <div id="quick-note-preview-modal" class="modal-overlay hidden">
    <div class="modal modal-sm preview-modal-card">
      <div class="modal-sheet-handle mobile-only"></div>
      
      <div class="preview-modal-top">
        <span class="preview-type-tag">Quick Note</span>
        <button type="button" class="modal-close quick-note-preview-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="preview-modal-body">
        <div id="quick-note-preview-image-container" class="preview-hero-img-box hidden" style="margin-bottom: 14px;">
          <div class="pannable-image-wrapper" id="quick-note-preview-pan-wrapper">
            <img id="quick-note-preview-modal-img" alt="Item Photo" class="pannable-img" draggable="false">
            <div class="img-drag-indicator hidden" id="quick-note-preview-drag-hint">
              <i data-lucide="move"></i>
              <span>Drag to pan</span>
            </div>
          </div>
        </div>
        <h3 id="quick-note-preview-name" class="preview-title"></h3>
        <div id="quick-note-preview-price" class="preview-price"></div>

        <div class="preview-details-list">
          <div class="preview-detail-row">
            <span class="preview-detail-label">Group</span>
            <div id="quick-note-preview-group" class="preview-detail-value"></div>
          </div>
          <div class="preview-detail-row">
            <span class="preview-detail-label">Priority</span>
            <div id="quick-note-preview-priority" class="preview-detail-value"></div>
          </div>
          <div class="preview-detail-row" id="quick-note-preview-link-row">
            <span class="preview-detail-label">Link</span>
            <div id="quick-note-preview-link-val" class="preview-detail-value"></div>
          </div>
        </div>

        <div class="preview-modal-actions">
          <button type="button" id="quick-note-preview-edit-btn" class="btn-preview-primary" style="width: 100%;" title="Edit this item">
            <i data-lucide="edit-2"></i>
            <span>Edit Item</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Note Add / Edit Modal -->
  <div id="quick-note-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-sheet-handle mobile-only"></div>
      <div class="modal-header">
        <h2 id="quick-note-modal-title">Add Item</h2>
        <button type="button" class="modal-close quick-note-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="quick-note-form">
        <div class="form-group">
          <label for="quick-note-title-input" id="quick-note-title-label">Item Name</label>
          <input type="text" id="quick-note-title-input" placeholder="e.g. Mechanical Keyboard" required autocomplete="off">
        </div>
        <div class="form-row" style="display: flex; gap: 12px; margin-bottom: 16px;">
          <div class="form-group" style="flex: 1; margin-bottom: 0;">
            <label for="quick-note-price-input">Price</label>
            <input type="number" id="quick-note-price-input" class="mono-input" placeholder="0" min="0" step="any" autocomplete="off">
          </div>
          <div class="form-group" style="flex: 1; margin-bottom: 0;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
              <label for="quick-note-group-input" style="margin-bottom: 0;">Group <span class="optional">(optional)</span></label>
              <button type="button" id="quick-note-ungroup-btn" class="btn-text-subtle hidden" style="font-size: 11.5px; color: #DC2626; background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline;">Remove from group</button>
            </div>
            <input type="text" id="quick-note-group-input" placeholder="e.g. Desk Setup" autocomplete="off" list="group-options-list">
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label for="quick-note-link-input">Link / URL <span class="optional">(optional)</span></label>
          <input type="text" id="quick-note-link-input" placeholder="e.g. shopee.co.id/... or https://..." autocomplete="off">
          <div id="quick-note-link-warning" class="input-warning-hint hidden"></div>
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <label style="margin-bottom: 0;">Photo <span class="optional">(optional)</span></label>
            <button type="button" id="quick-note-paste-btn" class="btn-paste-chip" title="Paste photo from clipboard">
              <i data-lucide="clipboard" style="width: 12px; height: 12px;"></i>
              <span>Paste Photo</span>
            </button>
          </div>
          <div class="quick-note-upload-box" id="quick-note-upload-area">
            <i data-lucide="image-plus" style="width: 18px; height: 18px; color: #71717A;"></i>
            <span>Upload photo or tap to browse</span>
            <input type="file" id="quick-note-image-upload" accept="image/*" style="display: none;">
          </div>
          <div id="quick-note-image-preview" class="quick-note-img-preview-card hidden">
            <div class="pannable-image-wrapper" id="quick-note-edit-pan-wrapper">
              <img id="quick-note-preview-img" alt="Preview" class="pannable-img" draggable="false">
              <div class="img-drag-indicator hidden" id="quick-note-edit-drag-hint">
                <i data-lucide="move"></i>
                <span>Drag to pan</span>
              </div>
            </div>
            <button type="button" id="quick-note-remove-image-btn" class="quick-note-remove-img-btn" title="Remove photo">
              <i data-lucide="x"></i>
            </button>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label>Priority Level</label>
          <div class="priority-options" id="quick-note-priority-options">
            <button type="button" class="priority-btn" data-priority="1">
              <span class="priority-badge">P1</span>
              <span class="priority-label">High Priority</span>
            </button>
            <button type="button" class="priority-btn active" data-priority="2">
              <span class="priority-badge">P2</span>
              <span class="priority-label">Medium</span>
            </button>
            <button type="button" class="priority-btn" data-priority="3">
              <span class="priority-badge">P3</span>
              <span class="priority-label">Low</span>
            </button>
          </div>
        </div>
        <div class="form-actions" style="display: flex; gap: 10px; align-items: center;">
          <button type="button" id="quick-note-delete-btn" class="btn-danger hidden" style="padding: 10px 14px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
            <span>Delete</span>
          </button>
          <button type="submit" id="quick-note-submit-btn" class="btn-primary" style="flex: 1;">
            <span>Save Item</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Authentication Modal (Sign In / Register) -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal auth-modal-card">
      <div class="modal-header auth-modal-header">
        <div class="auth-header-brand">
          <svg class="seamless-logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;">
            <path d="M6 11L12 26L18 15L24 26L30 11" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="8" r="1.75" fill="currentColor"/>
          </svg>
          <span class="auth-brand-name">Wishlist</span>
        </div>
        <button type="button" class="modal-close auth-modal-close" id="auth-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- Auth Tabs: Sign In / Create Account -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="auth-tab-signin" data-auth-mode="signin">Sign In</button>
        <button type="button" class="auth-tab-btn" id="auth-tab-signup" data-auth-mode="signup">Create Account</button>
      </div>

      <form id="auth-form" class="auth-form">
        <!-- Error Box -->
        <div id="auth-error-box" class="auth-error-alert hidden"></div>

        <!-- Full Name (Sign Up only) -->
        <div class="form-group hidden" id="auth-name-group">
          <label for="auth-name-input">Full Name</label>
          <input type="text" id="auth-name-input" placeholder="e.g. Alex Morgan" autocomplete="name">
        </div>

        <!-- Email or Username -->
        <div class="form-group">
          <label for="auth-email-input" id="auth-email-label">Email or Username</label>
          <input type="text" id="auth-email-input" placeholder="name@example.com" required autocomplete="username">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="auth-password-input">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="auth-password-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" id="auth-toggle-pwd" title="Toggle password visibility">
              <i data-lucide="eye" style="width: 14px; height: 14px;"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="auth-submit-btn" class="btn-primary auth-submit-btn">
          <span id="auth-submit-text">Sign In</span>
        </button>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <!-- Continue as Guest -->
        <button type="button" id="auth-guest-btn" class="btn-secondary auth-guest-btn">
          <i data-lucide="user" style="width: 14px; height: 14px;"></i>
          <span>Continue as Guest</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="app.js?v=219" defer></script>
</body>
</html>
