<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WISHLIST | Aspirations Catalog</title>
  <meta name="description" content="A curated personal aspiration and wishlist tracker. Minimalist design, precise savings tracking.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2318181b%22/><text x=%2250%25%22 y=%2262%25%22 font-family=%22monospace%22 font-size=%2250%22 font-weight=%22bold%22 fill=%22white%22 text-anchor=%22middle%22>W</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;550;600;650;700;800&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=367">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <div class="header-top">
        <div class="header-top-left">
          <div class="brand">
            <svg class="seamless-logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" title="Wishlist">
              <path d="M6 11L12 26L18 15L24 26L30 11" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="18" cy="8" r="1.75" fill="currentColor"/>
            </svg>
          </div>
        </div>
        <!-- Header Right Group: User Profile -->
        <div class="header-right-group">
          <!-- User Profile / Auth Button -->
          <div class="user-profile-wrapper" id="user-profile-wrapper">
            <button type="button" class="user-profile-btn" id="user-profile-btn" aria-label="User Account" title="Account Menu">
              <div class="user-avatar-badge" id="user-avatar-badge">
                <i data-lucide="user" class="avatar-icon"></i>
              </div>
              <span class="user-display-name" id="user-display-name">Sign In</span>
              <i data-lucide="chevron-down" class="user-dropdown-arrow"></i>
            </button>

            <div class="user-profile-dropdown hidden" id="user-profile-dropdown">
              <div class="user-dropdown-header">
                <div class="user-dropdown-avatar" id="dropdown-user-avatar">
                  <i data-lucide="user"></i>
                </div>
                <div class="user-dropdown-info">
                  <div class="user-dropdown-name" id="dropdown-user-name">Guest User</div>
                  <div class="user-dropdown-email" id="dropdown-user-email">Not signed in</div>
                </div>
              </div>
              <div class="user-dropdown-stats">
                <div class="user-stat-item">
                  <span class="user-stat-count" id="dropdown-notes-count">0</span>
                  <span class="user-stat-label">Items</span>
                </div>
              </div>
              <div class="user-dropdown-divider"></div>
              <div class="user-dropdown-actions">
                <input type="file" id="import-json-input" accept=".json,application/json" style="display: none;">
                <button type="button" class="dropdown-action-btn" id="dropdown-sync-btn">
                  <i data-lucide="refresh-cw"></i>
                  <span>Sync Cloud Now</span>
                </button>
                <button type="button" class="dropdown-action-btn" id="dropdown-export-btn">
                  <i data-lucide="download"></i>
                  <span>Export Backup (.json)</span>
                </button>
                <button type="button" class="dropdown-action-btn" id="dropdown-import-btn">
                  <i data-lucide="upload"></i>
                  <span>Import Backup (.json)</span>
                </button>
                <div class="user-dropdown-divider"></div>
                <button type="button" class="dropdown-action-btn" id="dropdown-switch-user-btn">
                  <i data-lucide="user-check"></i>
                  <span>Switch Account</span>
                </button>
                <button type="button" class="dropdown-action-btn logout-action" id="dropdown-logout-btn">
                  <i data-lucide="log-out"></i>
                  <span>Log Out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Item List View (Quick Notes) -->
    <div id="notes-view">
      <div class="notes-summary-bar">
        <div class="stat-card">
          <span class="stat-label">Total Items</span>
          <span class="stat-value" id="notes-items-count">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Estimated Total</span>
          <span class="stat-value" id="notes-total-value"><span class="currency-prefix">Rp.</span>0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Remaining Needed</span>
          <span class="stat-value" id="notes-remaining-value"><span class="currency-prefix">Rp.</span>0</span>
        </div>
      </div>

      <div class="overall-progress notes-progress-container">
        <div class="progress-bar-container">
          <div class="progress-bar">
            <div class="progress-fill" id="notes-progress-fill"></div>
          </div>
        </div>
        <span class="progress-text mono-text" id="notes-progress-text">0%</span>
      </div>

      <div class="clean-notes-card">
        <div class="notes-card-header">
          <div class="notes-header-left">
            <span class="notes-card-title" id="notes-view-title">Wishlist Notes</span>
            <button type="button" id="notes-back-to-view-btn" class="btn-clean-action hidden" title="Back to view">
              <i data-lucide="arrow-left"></i>
              <span>Back</span>
            </button>
          </div>
          <div class="notes-header-controls">
            <div class="notes-header-actions" id="notes-view-actions">
              <!-- Sort Dropdown for Quick Notes -->
              <div class="notes-sort-dropdown" id="notes-sort-dropdown">
                <button type="button" class="btn-clean-action notes-sort-trigger" id="notes-sort-trigger" title="Sort items">
                  <span id="notes-sort-label">Priority</span>
                  <i data-lucide="arrow-down-narrow-wide" id="notes-sort-icon" class="sort-direction-icon"></i>
                </button>
                <div class="sort-dropdown-menu hidden" id="notes-sort-menu">
                  <button type="button" class="sort-menu-item" data-sort="priority">
                    <span>Priority</span>
                    <i data-lucide="arrow-down-narrow-wide" class="sort-menu-item-icon"></i>
                  </button>
                  <button type="button" class="sort-menu-item" data-sort="price">
                    <span>Price</span>
                    <i data-lucide="arrow-down-1-0" class="sort-menu-item-icon"></i>
                  </button>
                  <button type="button" class="sort-menu-item" data-sort="title">
                    <span>Title</span>
                    <i data-lucide="arrow-down-a-z" class="sort-menu-item-icon"></i>
                  </button>
                  <button type="button" class="sort-menu-item" data-sort="date">
                    <span>Date</span>
                    <i data-lucide="calendar-arrow-down" class="sort-menu-item-icon"></i>
                  </button>
                </div>
              </div>

              <button type="button" id="notes-edit-mode-btn" class="btn-clean-action" title="Edit items">
                <i data-lucide="edit-3"></i>
                <span>Edit</span>
              </button>
            </div>

            <div class="notes-header-actions hidden" id="notes-edit-actions">
              <button type="button" id="notes-select-toggle-btn" class="btn-clean-action" title="Select multiple items">
                <i data-lucide="check-square"></i>
                <span>Select</span>
              </button>
              <button type="button" id="main-add-note-btn" class="btn-clean-action-primary" title="Add Note Item">
                <i data-lucide="plus"></i>
                <span>Add</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Multi-select Action Bar (Icon-only actions) -->
        <div id="notes-selection-bar" class="notes-selection-bar hidden">
          <span id="notes-selected-count" class="notes-selected-count">0 selected</span>
          <div class="notes-selection-actions">
            <button type="button" id="notes-select-all-btn" class="btn-selection-action" title="Select All / Deselect All" aria-label="Select All">
              <i data-lucide="check-check"></i>
            </button>
            <button type="button" id="notes-complete-selected-btn" class="btn-selection-action" disabled title="Complete / Incomplete selected" aria-label="Complete selected">
              <i data-lucide="check-circle-2"></i>
            </button>
            <button type="button" id="notes-group-selected-btn" class="btn-selection-action btn-group-action" disabled title="Group selected items" aria-label="Group selected">
              <i data-lucide="folder-plus"></i>
            </button>
            <button type="button" id="notes-ungroup-selected-btn" class="btn-selection-action" disabled title="Remove selected from groups" aria-label="Ungroup selected">
              <i data-lucide="corner-up-left"></i>
            </button>
            <button type="button" id="notes-delete-selected-btn" class="btn-selection-action btn-delete-action" disabled title="Delete selected items" aria-label="Delete selected">
              <i data-lucide="trash-2"></i>
            </button>
          </div>
        </div>

        <div id="quick-notes-manage-list" class="quick-notes-manage-list"></div>
      </div>
    </div>
  </div>

  <!-- Floating Mobile Action Bar -->
  <div id="mobile-floating-bar" class="mobile-only hidden">
    <button id="mobile-add-btn" class="floating-primary-btn" title="Add Item">
      <i data-lucide="plus"></i>
    </button>
  </div>

  <!-- Group / Rename Modal -->
  <div id="group-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-sheet-handle mobile-only"></div>
      <div class="modal-header">
        <h2 id="group-modal-title">Group Items</h2>
        <button type="button" class="modal-close group-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <form id="group-form">
          <div class="form-group" style="margin-bottom: 14px;">
            <label for="group-name-input">Group Name</label>
            <input type="text" id="group-name-input" placeholder="e.g. Outfit, Electronics, Desk Setup" required autocomplete="off" list="group-options-list">
            <datalist id="group-options-list"></datalist>
          </div>

          <div class="form-group" style="margin-bottom: 14px;">
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 8px; display: block;">Suggested Presets</label>
            <div class="category-preset-chips" id="group-modal-presets"></div>
          </div>

          <div class="form-group" style="margin-bottom: 20px;">
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 8px; display: block;">Custom Icon</label>
            <div class="group-emoji-picker-grid" id="group-emoji-picker"></div>
          </div>

          <div class="form-actions">
            <button type="submit" id="group-save-btn" class="btn-primary" style="width: 100%;">Save Group</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Confirm Dialog Modal -->
  <div id="confirm-modal" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <div class="modal-sheet-handle mobile-only"></div>
      <div class="modal-header">
        <h2 id="confirm-modal-title">Confirm Action</h2>
        <button type="button" class="modal-close confirm-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <p id="confirm-modal-message" style="margin-bottom: 20px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.5;"></p>
        <div class="form-actions">
          <button type="button" id="confirm-modal-action-btn" class="btn-danger">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Note Preview Modal (View Mode) -->
  <div id="quick-note-preview-modal" class="modal-overlay hidden">
    <div class="modal modal-sm preview-modal-card">
      <div class="modal-sheet-handle mobile-only"></div>
      
      <div class="preview-modal-top">
        <div id="quick-note-preview-top-badge" class="preview-group-indicator"></div>
        <button type="button" class="modal-close quick-note-preview-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="preview-modal-body">
        <div id="quick-note-preview-image-container" class="preview-hero-img-box hidden">
          <div class="pannable-image-wrapper can-pan" id="quick-note-preview-pan-wrapper">
            <img id="quick-note-preview-modal-img" alt="Item Photo" class="pannable-img" draggable="false">
            <div class="img-controls-bar">
              <button type="button" id="preview-img-fullscreen-btn" class="img-action-pill" title="Full Resolution">
                <i data-lucide="maximize-2"></i>
                <span>Full</span>
              </button>
              <button type="button" id="preview-img-fit-btn" class="img-action-pill" title="Toggle Fit">
                <i data-lucide="crop"></i>
                <span id="preview-img-fit-text">Cover</span>
              </button>
            </div>
            <div class="img-drag-indicator" id="quick-note-preview-drag-hint">
              <i data-lucide="move"></i>
              <span>Drag to reposition</span>
            </div>
          </div>
        </div>

        <div class="preview-header-meta">
          <h3 id="quick-note-preview-name" class="preview-title"></h3>
          <div class="preview-price-wrap">
            <span id="quick-note-preview-price" class="preview-price"></span>
            <span id="quick-note-preview-status-pill" class="preview-status-tag hidden"></span>
          </div>
        </div>

        <div class="preview-details-list">
          <div class="preview-detail-row" id="quick-note-preview-group-row">
            <span class="preview-detail-label">Group</span>
            <span id="quick-note-preview-group" class="preview-detail-value"></span>
          </div>
          <div class="preview-detail-row" id="quick-note-preview-priority-row">
            <span class="preview-detail-label">Priority</span>
            <span id="quick-note-preview-priority" class="preview-detail-value"></span>
          </div>
          <div class="preview-detail-row" id="quick-note-preview-link-row">
            <span class="preview-detail-label">Source</span>
            <span id="quick-note-preview-link-val" class="preview-detail-value"></span>
          </div>
        </div>

        <div class="preview-modal-actions">
          <button type="button" id="quick-note-preview-edit-btn" class="btn-preview-primary" title="Edit this item">
            <i data-lucide="edit-2"></i>
            <span>Edit Item</span>
          </button>
          <a id="quick-note-preview-visit-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-preview-secondary hidden" title="Open Store Page">
            <i data-lucide="external-link"></i>
            <span>Open Link</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Note Add / Edit Modal -->
  <div id="quick-note-modal" class="modal-overlay hidden">
    <div class="modal modal-add-card">
      <div class="modal-header">
        <h2 id="quick-note-modal-title">Add Item</h2>
        <button type="button" class="modal-close quick-note-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>
      <form id="quick-note-form" class="modal-add-form">
        <!-- 1. Item Name -->
        <div class="form-group">
          <label for="quick-note-title-input">Item Name</label>
          <input type="text" id="quick-note-title-input" class="modal-input" placeholder="What do you want to wish for?" required autocomplete="off">
        </div>

        <!-- 2. Price & Group in 2-Column Grid -->
        <div class="form-grid-2">
          <div class="form-group">
            <label for="quick-note-price-input">Price</label>
            <input type="number" id="quick-note-price-input" class="modal-input mono-input" placeholder="0" min="0" step="any" autocomplete="off">
          </div>
          <div class="form-group" id="quick-note-group-container">
            <label for="quick-note-group-input">Group</label>
            <input type="text" id="quick-note-group-input" class="modal-input" placeholder="e.g. Workspace" autocomplete="off">
            <!-- Floating Existing Group Pills Dropdown -->
            <div id="quick-note-group-pills-list" class="modal-group-floating-tray hidden"></div>
          </div>
        </div>

        <!-- 3. Product Link with Integrated Clean Auto-fill Button -->
        <div class="form-group">
          <div class="label-with-action">
            <label for="quick-note-link-input">Product Link</label>
            <button type="button" id="quick-note-fetch-link-btn" class="modal-autofill-btn" title="Auto-detect product details">
              <i data-lucide="link-2"></i>
              <span id="quick-note-fetch-text">Auto-fill</span>
            </button>
          </div>
          <input type="text" id="quick-note-link-input" class="modal-input" placeholder="Paste Shopee, Tokopedia, or web link..." autocomplete="off">
        </div>

        <!-- 4. Photo & Priority in 2-Column Grid -->
        <div class="form-grid-2">
          <!-- Photo Upload Button / Thumbnail -->
          <div class="form-group">
            <label>Photo</label>
            <div class="modal-media-wrap">
              <div class="modal-photo-drop" id="quick-note-upload-area">
                <i data-lucide="image-plus"></i>
                <span>Add Photo</span>
                <input type="file" id="quick-note-image-upload" accept="image/*" style="display: none;">
              </div>
              <div id="quick-note-image-preview" class="modal-photo-thumb hidden">
                <img id="quick-note-preview-img" alt="Preview" draggable="false">
                <span class="modal-photo-thumb-info">Photo attached</span>
                <button type="button" id="quick-note-remove-image-btn" class="modal-photo-remove-btn" title="Remove photo">
                  <i data-lucide="x"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Minimalist Priority Custom Select -->
          <div class="form-group custom-select-group" id="quick-note-priority-container">
            <label>Priority</label>
            <div class="custom-dropdown-wrap">
              <button type="button" id="quick-note-priority-trigger" class="custom-dropdown-btn">
                <span class="prio-text" id="quick-note-priority-badge">Medium</span>
                <i data-lucide="chevron-down" class="dropdown-chevron"></i>
              </button>
              <input type="hidden" id="quick-note-priority-input" value="2">
              <div id="quick-note-priority-menu" class="custom-dropdown-menu hidden">
                <button type="button" class="custom-dropdown-item" data-priority="1">
                  <span class="prio-item-label">High</span>
                  <i data-lucide="check" class="item-check"></i>
                </button>
                <button type="button" class="custom-dropdown-item active" data-priority="2">
                  <span class="prio-item-label">Medium</span>
                  <i data-lucide="check" class="item-check"></i>
                </button>
                <button type="button" class="custom-dropdown-item" data-priority="3">
                  <span class="prio-item-label">Low</span>
                  <i data-lucide="check" class="item-check"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Hidden elements preserved for code compatibility -->
        <input type="checkbox" id="quick-note-checked-input" style="display: none;">
        <button type="button" id="quick-note-delete-btn" class="hidden" style="display: none;"></button>
        <button type="button" id="quick-note-ungroup-btn" class="hidden" style="display: none;"></button>

        <!-- 5. Single Full-Width Primary Action Button -->
        <div class="modal-submit-wrap">
          <button type="submit" id="quick-note-submit-btn" class="modal-save-btn">
            <span>Save Item</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Authentication Modal (Sign In / Register) -->
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal auth-modal-card">
      <div class="modal-header auth-modal-header">
        <div class="auth-header-brand">
          <svg class="seamless-logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;">
            <path d="M6 11L12 26L18 15L24 26L30 11" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="8" r="1.75" fill="currentColor"/>
          </svg>
          <span class="auth-brand-name">Wishlist</span>
        </div>
        <button type="button" class="modal-close auth-modal-close" id="auth-modal-close" aria-label="Close modal">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- Auth Tabs: Sign In / Create Account -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="auth-tab-signin" data-auth-mode="signin">Sign In</button>
        <button type="button" class="auth-tab-btn" id="auth-tab-signup" data-auth-mode="signup">Create Account</button>
      </div>

      <form id="auth-form" class="auth-form">
        <!-- Error Box -->
        <div id="auth-error-box" class="auth-error-alert hidden"></div>

        <!-- Full Name (Sign Up only) -->
        <div class="form-group hidden" id="auth-name-group">
          <label for="auth-name-input">Full Name</label>
          <input type="text" id="auth-name-input" placeholder="e.g. Alex Morgan" autocomplete="name">
        </div>

        <!-- Email or Username -->
        <div class="form-group">
          <label for="auth-email-input" id="auth-email-label">Email or Username</label>
          <input type="text" id="auth-email-input" placeholder="name@example.com" required autocomplete="username">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="auth-password-input">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="auth-password-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-pwd" id="auth-toggle-pwd" title="Toggle password visibility">
              <i data-lucide="eye" style="width: 14px; height: 14px;"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="auth-submit-btn" class="btn-primary auth-submit-btn">
          <span id="auth-submit-text">Sign In</span>
        </button>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <!-- Continue as Guest -->
        <button type="button" id="auth-guest-btn" class="btn-secondary auth-guest-btn">
          <i data-lucide="user" style="width: 14px; height: 14px;"></i>
          <span>Continue as Guest</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Full-Resolution Image Lightbox Modal -->
  <div id="image-lightbox-modal" class="modal-overlay hidden" style="z-index: 1000; background: rgba(0, 0, 0, 0.92); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(12px);">
    <button type="button" id="lightbox-close-btn" class="modal-close" style="position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.15); color: #FFF; border-radius: 9999px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: all 150ms ease;" title="Close">
      <i data-lucide="x"></i>
    </button>
    <div style="max-width: 94vw; max-height: 94vh; display: flex; align-items: center; justify-content: center; position: relative;">
      <img id="lightbox-full-img" src="" alt="Full Resolution" style="max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 8px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); user-select: none;">
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="app.js?v=367" defer></script>
</body>
</html>
